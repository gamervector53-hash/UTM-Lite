name: Build UTM Lite iOS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repack:
    name: Repack current UTM JIT IPA
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Download current upstream UTM IPA
        uses: actions/download-artifact@v4
        with:
          name: UTM.ipa
          path: upstream
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: utmapp/UTM
          run-id: 36090554968

      - name: Locate upstream IPA
        shell: bash
        run: |
          find upstream -maxdepth 3 -type f -print
          IPA="$(find upstream -type f -name '*.ipa' -print -quit)"
          test -n "$IPA"
          cp "$IPA" UTM-upstream.ipa

      - name: Unpack
        shell: bash
        run: |
          rm -rf repack
          mkdir repack
          cd repack
          unzip -q ../UTM-upstream.ipa
          test -d Payload/UTM.app

      - name: Slim and reuse Pocket8 bundle ID
        shell: bash
        run: |
          APP="repack/Payload/UTM.app"
          echo "Before:"
          du -sh "$APP"

          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.jevon.pocket8" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName UTM Lite" "$APP/Info.plist" || true

          HELPER_PLIST="$(find "$APP" -path '*/iOSHelper.appex/Info.plist' -print -quit || true)"
          if [ -n "$HELPER_PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.jevon.pocket8.iOSHelper" "$HELPER_PLIST"
          fi

          find "$APP" -type d -name 'qemu-*-softmmu.framework' -print0 |
          while IFS= read -r -d '' FW; do
            case "$(basename "$FW")" in
              qemu-aarch64-softmmu.framework|qemu-x86_64-softmmu.framework)
                echo "Keeping $(basename "$FW")"
                ;;
              *)
                echo "Removing $(basename "$FW")"
                rm -rf "$FW"
                ;;
            esac
          done

          find "$APP" -type d -name '*.lproj' -print0 |
          while IFS= read -r -d '' LPROJ; do
            case "$(basename "$LPROJ")" in
              en.lproj|Base.lproj)
                ;;
              *)
                rm -rf "$LPROJ"
                ;;
            esac
          done

          find "$APP" -type d -name '_CodeSignature' -prune -exec rm -rf {} + || true
          find "$APP" -name '.DS_Store' -delete || true

          echo "After:"
          du -sh "$APP"

      - name: Build maximum-compression IPA
        shell: bash
        run: |
          cd repack
          zip -qry -9 ../VectorUTM-Lite.ipa Payload
          cd ..
          test -s VectorUTM-Lite.ipa

      - name: Record build info
        shell: bash
        run: |
          APP="repack/Payload/UTM.app"
          {
            echo "VectorUTM Lite"
            echo "Upstream UTM commit: 7eadb056ae0f91d979059544d0ddcd2d5a40be92"
            echo "Source workflow run: 36090554968"
            echo "Main source bundle ID: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
            echo "Expected SideStore main ID: com.jevon.pocket8.55CB4Z939B"
            echo "Installed app tree: $(du -sh "$APP" | cut -f1)"
            echo "IPA size: $(du -h VectorUTM-Lite.ipa | cut -f1)"
            echo "Guest backends kept: aarch64, x86_64"
            echo "JIT: regular UTM iOS build"
            echo "SHA256: $(shasum -a 256 VectorUTM-Lite.ipa | awk '{print $1}')"
          } | tee SIZE.txt
          cat SIZE.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: VectorUTM-Lite-${{ github.run_number }}
          path: |
            VectorUTM-Lite.ipa
            SIZE.txt
          compression-level: 0

      - name: Publish direct IPA release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="lite-build-${{ github.run_number }}"
          gh release create "$TAG" VectorUTM-Lite.ipa SIZE.txt             --title "VectorUTM Lite build ${{ github.run_number }}"             --notes "Low-storage regular UTM iOS JIT build. Source bundle ID: com.jevon.pocket8. Expected SideStore ID: com.jevon.pocket8.55CB4Z939B. Keeps aarch64 and x86_64 guest backends."
